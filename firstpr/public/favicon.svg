<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Bright energetic gradient -->
    <linearGradient id="main-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />    <!-- Cyan/Sky -->
      <stop offset="50%" stop-color="#2dd4bf" />   <!-- Teal -->
      <stop offset="100%" stop-color="#f59e0b" />  <!-- Amber/Yellow -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Branch curve starting from the stem of '1' -->
    <path d="M 100 160 C 170 160, 180 120, 180 80" fill="none" stroke="url(#main-grad)" stroke-width="32" />
    
    <!-- Node on the branch -->
    <circle cx="180" cy="70" r="18" fill="#1e293b" stroke="url(#main-grad)" stroke-width="12" />
    
    <!-- The "1" shape - Vertical Stem -->
    <path d="M 100 200 L 100 40 L 50 80" fill="none" stroke="url(#main-grad)" stroke-width="38" />
    
    <!-- The base serif of "1" -->
    <path d="M 60 200 L 140 200" fill="none" stroke="url(#main-grad)" stroke-width="38" />
  </g>
</svg>
